      // ============================================
      // وظيفة تحميل مكتبة Supabase ديناميكياً
      // ============================================
      function loadSupabaseLibrary() {
        return new Promise((resolve, reject) => {
          if (window.supabase) {
            resolve(window.supabase);
            return;
          }

          const script = document.createElement("script");
          script.src =
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
          script.type = "text/javascript";
          script.crossOrigin = "anonymous";

          script.onload = () => {
            if (window.supabase) {
              resolve(window.supabase);
            } else {
              reject(new Error("مكتبة Supabase لم تحمل بشكل صحيح"));
            }
          };

          script.onerror = () => {
            reject(new Error("فشل في تحميل مكتبة Supabase"));
          };

          document.head.appendChild(script);
        });
      }

      // ============================================
      // وظيفة تنظيف القيم
      // ============================================
      function cleanValue(value) {
        if (value === null || value === undefined) {
          return "";
        }

        const strValue = String(value).trim();

        if (
          strValue === "" ||
          strValue.toLowerCase() === "nothing" ||
          strValue.toLowerCase() === "null" ||
          strValue.toLowerCase() === "undefined"
        ) {
          return "";
        }

        if (strValue === "#" || strValue === "##" || strValue === "###") {
          return "";
        }

        return strValue.replace(/#/g, "");
      }

      // ============================================
      // وظيفة إنشاء سطر الرموز
      // ============================================
      function createSymbolsRow() {
        const tableHeaders = document.querySelectorAll(
          "#weather-table thead th",
        );

        const symbolsRow = document.createElement("tr");
        symbolsRow.className = "symbols-row";

        const firstCell = document.createElement("td");
        firstCell.textContent = "الرمز";
        firstCell.style.fontWeight = "bold";
        symbolsRow.appendChild(firstCell);

        for (let i = 1; i < tableHeaders.length; i++) {
          const headerText = tableHeaders[i].textContent.trim();
          const cell = document.createElement("td");

          if (ELEMENT_SYMBOLS[headerText]) {
            cell.textContent = ELEMENT_SYMBOLS[headerText];
          } else {
            cell.textContent = "";
          }

          symbolsRow.appendChild(cell);
        }

        tableBody.appendChild(symbolsRow);
      }

      // ============================================
      // وظيفة مساعدة للعثور على سجل حسب الوقت العالمي
      // ============================================
      function findRecordByUtcHour(data, hour) {
        const hourStr = hour.toString().padStart(2, "0");

        let record = data.find((item) => {
          if (!item.utc_time) return false;

          const itemTime = item.utc_time.toString().trim();

          if (itemTime === hourStr) return true;

          if (itemTime.includes(":")) {
            const [hours] = itemTime.split(":");
            return hours.padStart(2, "0") === hourStr;
          }

          const itemHourNum = parseInt(itemTime);
          return !isNaN(itemHourNum) && itemHourNum === hour;
        });

        return record || null;
      }

      // ============================================
      // وظيفة لتحويل الوقت العالمي إلى وقت محلي (UTC+3)
      // ============================================
      function convertUtcToLocal(utcTime) {
        if (!utcTime && utcTime !== 0) return "";

        const utcStr = utcTime.toString().trim();
        let utcHour;

        if (utcStr.includes(":")) {
          const [hours] = utcStr.split(":");
          utcHour = parseInt(hours);
        } else {
          utcHour = parseInt(utcStr);
        }

        if (isNaN(utcHour)) return "";

        const localHour = (utcHour + 3) % 24;
        return localHour.toString().padStart(2, "0");
      }

      // ============================================
      // وظيفة مساعدة للعثور على سجل حسب الوقت المحلي
      // ============================================
      function findRecordByLocalHour(data, localHour) {
        let utcHour = (parseInt(localHour) - 3 + 24) % 24;
        return findRecordByUtcHour(data, utcHour);
      }

      // ============================================
      // وظيفة لاستخراج بيانات الخلايا من السجل
      // ============================================
      function getCellDataFromRecord(record) {
        return [
          record.relative_humidity,
          record.vapor_pressure,
          record.dew_point,
          record.station_pressure,
          record.sea_level_pressure,
          record.dry_temp,
          record.wet_temp,
          record.wind_direction,
          record.wind_speed,
          record.avg_wind_direction,
          record.avg_wind_speed,
          record.visibility,
          record.current_weather,
          record.past_weather,
          record.total_cloud_cover,
          record.cloud1_amount,
          record.cloud1_type,
          record.cloud1_height,
          record.cloud2_amount,
          record.cloud2_type,
          record.cloud2_height,
          record.cover12,
          record.cloud3_amount,
          record.cloud3_type,
          record.cloud3_height,
          record.cover123,
          record.cloud4_amount,
          record.vapor_pressure_diff,
        ];
      }

      // ============================================
      // وظيفة الاتصال بقاعدة البيانات
      // ============================================
      async function connectToDatabase() {
        try {
          updateConnectionStatus("connecting", "جاري تحميل مكتبة Supabase...");

          const supabaseLib = await loadSupabaseLibrary();

          updateConnectionStatus(
            "connecting",
            "جاري الاتصال بقاعدة البيانات...",
          );

          supabaseClient = supabaseLib.createClient(
            SUPABASE_CONFIG.url,
            SUPABASE_CONFIG.anonKey,
            {
              auth: {
                persistSession: false,
              },
              global: {
                headers: {
                  apikey: SUPABASE_CONFIG.anonKey,
                },
              },
            },
          );

          const { data, error } = await supabaseClient
            .from("hourly_reports")
            .select("count")
            .limit(1);

          if (error) {
            throw error;
          }

          isConnected = true;
          updateConnectionStatus("connected", "متصل بقاعدة البيانات");
          showMessage("success", "تم الاتصال بنجاح بقاعدة البيانات");

          return true;
        } catch (error) {
          console.error("خطأ في الاتصال بقاعدة البيانات:", error);
          isConnected = false;
          updateConnectionStatus("disconnected", "غير متصل بقاعدة البيانات");
          showMessage(
            "error",
            `خطأ في الاتصال بقاعدة البيانات: ${error.message}`,
          );

          showMessage("warning", "يتم استخدام بيانات تجريبية للاختبار");
          await loadDemoStations();
          await loadDemoYears();

          return false;
        }
      }

      // ============================================
      // تحديث حالة الاتصال
      // ============================================
      function updateConnectionStatus(status, text) {
        statusIndicator.className = "connection-status";

        switch (status) {
          case "connected":
            statusIndicator.classList.add("connection-connected");
            break;
          case "disconnected":
            statusIndicator.classList.add("connection-disconnected");
            break;
          case "connecting":
            statusIndicator.classList.add("connection-connecting");
            break;
        }

        statusText.textContent = text;
      }

      // ============================================
      // تحميل المحطات الحقيقية من قاعدة البيانات
      // ============================================
      async function loadStationsFromDB() {
        if (!isConnected || !supabaseClient) return;

        try {
          showMessage("info", "جاري تحميل قائمة المحطات...");

          const { data, error } = await supabaseClient
            .from("hourly_reports")
            .select("station_name")
            .order("station_name", { ascending: true });

          if (error) throw error;

          stations = [...new Set(data.map((item) => item.station_name))].filter(
            Boolean,
          );

          stationSelect.innerHTML = '<option value="">اختر المحطة...</option>';
          stations.forEach((station) => {
            const option = document.createElement("option");
            option.value = station;
            option.textContent = station;
            stationSelect.appendChild(option);
          });

          showMessage(
            "success",
            `تم تحميل ${stations.length} محطة من قاعدة البيانات`,
          );

          console.error("خطأ في تحميل المحطات:", error);
          showMessage(
            "error",
            `خطأ في تحميل المحطات: ${error.message}. يتم استخدام بيانات تجريبية.`,
          );
          await loadDemoStations();
        }
      }

      // ============================================
      // تحميل السنوات الحقيقية من قاعدة البيانات
      // ============================================
      async function loadYearsFromDB() {
        if (!isConnected || !supabaseClient) return;

        try {
          const { data, error } = await supabaseClient
            .from("hourly_reports")
            .select("submission_date")
            .order("submission_date", { ascending: false })
            .limit(100);

          if (error) throw error;

          const dates = data
            .map((item) => {
              try {
                return new Date(item.submission_date);
              } catch {
                return null;
              }
            })
            .filter((date) => date !== null);

          years = [...new Set(dates.map((date) => date.getFullYear()))].sort(
            (a, b) => b - a,
          );

          yearSelect.innerHTML = '<option value="">اختر السنة...</option>';
          years.forEach((year) => {
            const option = document.createElement("option");
            option.value = year;
            option.textContent = year;
            yearSelect.appendChild(option);
          });
        } catch (error) {
          console.error("خطأ في تحميل السنوات:", error);
          await loadDemoYears();
        }
      }

      // ============================================
      // وظيفة تحميل بيانات إدارة البيانات الجوية من قاعدة البيانات
      // ============================================
      async function loadWeatherDataFromDB(station, date) {
        if (!isConnected || !supabaseClient) {
          showMessage("error", "غير متصل بقاعدة البيانات");
          return [];
        }

        try {
          showMessage("info", `جاري تحميل بيانات ${station} لتاريخ ${date}...`);

          const { data, error } = await supabaseClient
            .from("hourly_reports")
            .select("*")
            .eq("station_name", station)
            .eq("submission_date", date)
            .order("utc_time", { ascending: true });

          if (error) throw error;

          if (data && data.length > 0) {
            const conversionLog = [];
            data.forEach((item) => {
              if (item.utc_time) {
                const localTime = convertUtcToLocal(item.utc_time);
                conversionLog.push(`UTC ${item.utc_time} → محلي ${localTime}`);
              }
            });

            console.log("تحويلات التوقيت:", conversionLog);

            showMessage(
              "success",
              `تم تحميل ${data.length} سجل بنجاح (تم تحويل التوقيت العالمي إلى محلي +3)`,
            );

            const filteredData = data.filter(
              (item) =>
                item.utc_time !== null &&
                item.utc_time !== undefined &&
                item.utc_time !== "",
            );

            return filteredData;
          } else {
            showMessage("warning", "لا توجد بيانات حقيقية للمعايير المحددة");
            return [];
          }
        } catch (error) {
          console.error("خطأ في تحميل البيانات:", error);
          showMessage("error", `خطأ في تحميل البيانات: ${error.message}`);
          return [];
        }
      }

      // ============================================
      // مسح بيانات الجدول (مع الاحتفاظ بسطر الرموز)
      // ============================================
      function clearTableData() {
        const symbolsRow = document.querySelector(".symbols-row");
        const rowsToRemove = tableBody.querySelectorAll("tr:not(.symbols-row)");

        rowsToRemove.forEach((row) => {
          row.remove();
        });

        if (symbolsRow && !tableBody.contains(symbolsRow)) {
          tableBody.appendChild(symbolsRow);
        }
      }

      // ============================================
      // عرض البيانات في الجدول (من 00 إلى 23)
      // مع تحويل التوقيت العالمي إلى محلي
      // ============================================
      function displayData(data) {
        clearTableData();

        if (!document.querySelector(".symbols-row")) {
          createSymbolsRow();
        }

        for (let localHour = 0; localHour <= 23; localHour++) {
          const localHourStr = localHour.toString().padStart(2, "0");

          const record = findRecordByLocalHour(data, localHour);

          const row = document.createElement("tr");

          const timeCell = document.createElement("td");
          timeCell.className = "time-cell";
          timeCell.textContent = localHourStr;

          if (record && record.utc_time) {
            const utcTime = cleanValue(record.utc_time);
            timeCell.title = `التوقيت العالمي: ${utcTime}`;
          }

          row.appendChild(timeCell);

          if (record) {
            const cellsData = getCellDataFromRecord(record);

            cellsData.forEach((value) => {
              const cell = document.createElement("td");
              cell.textContent = cleanValue(value);
              row.appendChild(cell);
            });
          } else {
            for (let i = 0; i < 28; i++) {
              const cell = document.createElement("td");
              cell.textContent = "";
              row.appendChild(cell);
            }
          }

          tableBody.appendChild(row);
        }
      }

      // ============================================
      // تحميل بيانات إدارة البيانات الجوية
      // ============================================
      async function loadWeatherData() {
        const station = stationSelect.value;
        const year = yearSelect.value;
        const month = monthSelect.value;
        const day = daySelect.value;

        if (!station) {
          showMessage("error", "يرجى اختيار المحطة");
          return;
        }

        if (!year || !month || !day) {
          showMessage(
            "error",
            "يرجى اختيار التاريخ كاملاً (السنة، الشهر، اليوم)",
          );
          return;
        }

        const paddedMonth = month.padStart(2, "0");
        const paddedDay = day.padStart(2, "0");
        const reportDate = `${year}-${paddedMonth}-${paddedDay}`;

        try {
          currentData = await loadWeatherDataFromDB(station, reportDate);

          if (currentData && currentData.length > 0) {
            displayData(currentData);
          } else {
            currentData = [];
            clearTableData();
            showMessage("warning", "لا توجد بيانات للمعايير المحددة");
          }
        } catch (error) {
          console.error("خطأ في تحميل البيانات:", error);
          showMessage("error", `خطأ في تحميل البيانات: ${error.message}`);
        }
      }

      // ============================================
      // تصدير إلى Excel مطابق للملف الأصلي
      // ============================================
      async function exportToExcel() {
        if (!currentData || currentData.length === 0) {
          showMessage("error", "لا توجد بيانات للتصدير");
          return;
        }

        try {
          showMessage("info", "جاري إنشاء ملف Excel...");

          const dataForExport = [];

          const headers = [
            "وقت الرصد",
            "الرطوبة النسبية %",
            "ضغط بخار الماء لأقرب عشر الميلبار",
            "درجة الندى لأقرب عشر (سْ)",
            "ضـغــط المـحـطـــة",
            "الضغط المحول لسطح البحر",
            "درجة الحرارة الجافة",
            "درجة الحرارة الرطبة",
            "اتجاه الرياح السطحية بعشرات الدرجات",
            "سرعة الرياح السطحية لأقرب م/ثا",
            "اتجاه المتوسط الساعي للرياح السطحية",
            "سرعة المتوسط الساعي للرياح السطحية",
            "الرؤية السطحية الأفقية بمئات الأمتار",
            "الطقس الحاضر",
            "الطقس الغابر",
            "التغطية الكلية للسحب",
            "كمية السحب في الطبقة الأولى",
            "نوع السحب في الطبقة الأولى",
            "ارتفاع السحب في الطبقة الأولى",
            "كمية السحب في الطبقة الثانية",
            "نوع السحب في الطبقة الثانية",
            "ارتفاع السحب في الطبقة الثانية",
            "مجموع التغطية للطبقتين 1+2",
            "كمية السحب في الطبقة الثالثة",
            "نوع السحب في الطبقة الثالثة",
            "ارتفاع السحب في الطبقة الثالثة",
            "مجموع التغطية للطبقات 1+2+3",
            "كمية السحب في الطبقة الرابعة",
            "فرق ضغط بخار الماء عن الإشباع",
          ];

          dataForExport.push(headers);

          const symbolsRow = ["الرمز"];
          for (let i = 1; i < headers.length; i++) {
            symbolsRow.push(ELEMENT_SYMBOLS[headers[i]] || "");
          }
          dataForExport.push(symbolsRow);

          for (let localHour = 0; localHour <= 23; localHour++) {
            const localHourStr = localHour.toString().padStart(2, "0");

            const record = findRecordByLocalHour(currentData, localHour);

            const rowData = [localHourStr];

            if (record) {
              const values = getCellDataFromRecord(record);

              values.forEach((value) => {
                rowData.push(cleanValue(value));
              });
            } else {
              for (let i = 0; i < 28; i++) {
                rowData.push("");
              }
            }

            dataForExport.push(rowData);
          }

          const ws = XLSX.utils.aoa_to_sheet(dataForExport);

          const wscols = [];
          for (let i = 0; i < headers.length; i++) {
            wscols.push({ wch: 20 });
          }
          ws["!cols"] = wscols;

          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "بيانات الأرصاد");

          const station = stationSelect.value || "محطة";
          const year = yearSelect.value || "2026";
          const month = monthSelect.value || "01";
          const day = daySelect.value || "01";
          const fileName = `ساعي_${station}_${year}-${month}-${day}.xlsx`;

          XLSX.writeFile(wb, fileName);

          showMessage("success", `تم تصدير الملف ${fileName} بنجاح`);
        } catch (error) {
          console.error("خطأ في التصدير إلى Excel:", error);
          showMessage("error", `خطأ في التصدير إلى Excel: ${error.message}`);
        }
      }

      // ============================================
      // مسح الفلاتر
      // ============================================
      function clearFilters() {
        stationSelect.value = "";
        yearSelect.value = "";
        monthSelect.value = "";
        daySelect.value = "";

        clearTableData();
        currentData = [];

        if (!document.querySelector(".symbols-row")) {
          createSymbolsRow();
        }

        showMessage("info", "تم مسح الفلاتر. يمكنك اختيار معايير جديدة.");
      }

      // ============================================
      // عرض رسالة
      // ============================================
      function showMessage(type, text) {
        const oldMessages = document.querySelectorAll(".message");
        oldMessages.forEach((msg) => msg.remove());

        const message = document.createElement("div");
        message.className = `message message-${type}`;
        message.innerHTML = `<i class="fas fa-${getIconForType(type)}"></i> ${text}`;

        document.body.appendChild(message);

        setTimeout(() => {
          if (message.parentNode) {
            message.style.transition = "opacity 0.5s";
            message.style.opacity = "0";
            setTimeout(() => message.remove(), 500);
          }
        }, 5000);
      }

      // الحصول على الأيقونة المناسبة لنوع الرسالة
      function getIconForType(type) {
        switch (type) {
          case "success":
            return "check-circle";
          case "error":
            return "exclamation-circle";
          case "warning":
            return "exclamation-triangle";
          case "info":
            return "info-circle";
          default:
            return "info-circle";
        }
      }

      // ============================================
      // تهيئة التطبيق عند تحميل الصفحة
      // ============================================
      document.addEventListener("DOMContentLoaded", async function () {
        createSymbolsRow();

        showMessage("info", "جاري تهيئة النظام...");

        const connected = await connectToDatabase();

        if (connected) {
          await loadStationsFromDB();
          await loadYearsFromDB();
        } else {
          await loadDemoStations();
          await loadDemoYears();
        }

        loadDataBtn.addEventListener("click", loadWeatherData);
        refreshBtn.addEventListener("click", loadWeatherData);
        exportExcelBtn.addEventListener("click", exportToExcel);
        clearFiltersBtn.addEventListener("click", clearFilters);

        yearSelect.addEventListener("change", function () {
          if (this.value) {
            monthSelect.disabled = false;
            daySelect.disabled = true;
            daySelect.innerHTML = '<option value="">اختر اليوم...</option>';
          }
        });

        monthSelect.addEventListener("change", function () {
          if (this.value && yearSelect.value) {
            daySelect.disabled = false;

            daySelect.innerHTML = '<option value="">اختر اليوم...</option>';
            for (let day = 1; day <= 31; day++) {
              const option = document.createElement("option");
              option.value = day.toString().padStart(2, "0");
              option.textContent = day;
              daySelect.appendChild(option);
            }
          }
        });

        showMessage(
          "success",
          "النظام جاهز للاستخدام. يرجى اختيار المحطة والتاريخ لتحميل البيانات.",
        );
      });
    </script>
  </body>
</html>
