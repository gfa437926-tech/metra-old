<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>القائمة الجانبية</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --sidebar-bg: #2c3e50;
        --sidebar-hover: #34495e;
        --sidebar-active: #3498db;
        --text-light: #ecf0f1;
      }

      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(
          180deg,
          var(--sidebar-bg) 0%,
          var(--sidebar-hover) 100%
        );
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .sidebar {
        width: 100%;
        height: 100vh;
        padding: 20px 0;
        color: var(--text-light);
      }

      .sidebar-header {
        text-align: center;
        padding: 0 20px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 20px;
      }

      .sidebar-logo {
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 50%;
        margin: 0 auto 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .sidebar-logo img {
        max-width: 50px;
        max-height: 50px;
        border-radius: 50%;
      }

      .sidebar-header h4 {
        font-size: 1.1rem;
        margin: 0;
        font-weight: 600;
      }

      .sidebar-header p {
        font-size: 0.85rem;
        opacity: 0.8;
        margin: 5px 0 0;
      }

      .nav-link {
        color: var(--text-light) !important;
        padding: 12px 20px;
        margin: 5px 10px;
        border-radius: 8px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        text-decoration: none;
      }

      .nav-link:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateX(-5px);
      }

      .nav-link.active {
        background: var(--sidebar-active);
        box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
      }

      .nav-link i {
        width: 20px;
        margin-left: 10px;
      }

      .logout-btn {
        color: #e74c3c !important;
        background: rgba(231, 76, 60, 0.1);
        margin-top: 20px;
      }

      .logout-btn:hover {
        background: rgba(231, 76, 60, 0.2);
      }

      /* تخصيص عنصر الظواهر الجوية */
      .weather-phenomena-item {
        background: linear-gradient(
          135deg,
          rgba(231, 76, 60, 0.2) 0%,
          rgba(192, 57, 43, 0.2) 100%
        );
        border-left: 3px solid #e74c3c;
        animation: pulse-border 2s infinite;
      }

      .weather-phenomena-item .nav-link {
        color: #ffcccc !important;
      }

      .weather-phenomena-item:hover {
        background: linear-gradient(
          135deg,
          rgba(231, 76, 60, 0.3) 0%,
          rgba(192, 57, 43, 0.3) 100%
        );
      }

      @keyframes pulse-border {
        0% {
          border-left-color: #e74c3c;
        }
        50% {
          border-left-color: #ff6b6b;
        }
        100% {
          border-left-color: #e74c3c;
        }
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="logo.jpg" alt="شعار النظام" />
        </div>
        <h4>نظام إدارة البيانات الجوية</h4>
        <p>الإدارة العامة</p>
      </div>

      <!-- القائمة الرئيسية -->
      <ul class="nav flex-column" id="sidebarMenu">
        <!-- سيتم تعبئته بواسطة JavaScript -->
      </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/protect.js"></script>

    <script>
      // نظام المسارات المحدث
      const UPDATED_SYSTEM_PATHS = {
        MAIN: "main.html",
        HOURLY_REPORTS: "pages/hourly/hourly_send/hourly_reports.html",
        DAILY_REPORTS: "pages/daily/daily_send/daily.html",
        RAINFALL_REPORTS: "pages/rain/rain_send/rainfall_reports.html",
        CLIMATE_HOURLY: "pages/h_climate/h_climate_send/h_climate_send.html",
        SOIL_TEMPERATURE: "pages/soil/soil_send/soil-send.html",
        AGRICULTURAL_REPORTS:
          "pages/arg/send-argicultural/agricultural_reports.html",
        FIX_EQUIPMENT: "pages/fix/fix.html",
        FIX_TELECOMM: "pages/fix/fix-tel.html",
        FIX_SOFTWARE: "pages/fix/it.html",
        STATION_MANAGER: "station-manager.html",
        CENTER_MANAGER: "center-manager.html",
        MANAGER_DASHBOARD: "manager-dashboard.html",
        WEATHER_PHENOMENA: "pages/weather_phenomena/weather_phenomena.html",
      };

      class SidebarManager {
        constructor() {
          this.currentUser = null;
          this.init();
        }

        init() {
          this.loadUserData();
          this.loadSidebarMenu();
        }

        loadUserData() {
          try {
            const userData = localStorage.getItem("currentUser");
            if (userData) {
              this.currentUser = JSON.parse(userData);
            }
          } catch (error) {
            console.error("خطأ في تحميل بيانات المستخدم:", error);
          }
        }

        loadSidebarMenu() {
          const sidebarMenu = document.getElementById("sidebarMenu");
          if (!sidebarMenu || !this.currentUser) return;

          const userRole = this.currentUser.role;

          let menuItems = this.getBaseMenuItems();

          // إضافة عنصر الظواهر الجوية في المكان المناسب
          // يمكن وضعه بعد التقارير الأساسية
          const weatherPhenomenaItem = {
            icon: "fas fa-bolt",
            text: "الظواهر الجوية",
            href: UPDATED_SYSTEM_PATHS.WEATHER_PHENOMENA,
            specialClass: "weather-phenomena-item",
          };

          // إضافة العنصر في الموضع المناسب (بعد التقارير الأساسية)
          menuItems.splice(4, 0, weatherPhenomenaItem);

          // إضافة عناصر خاصة حسب الصفة
          if (userRole === "رئيس محطة") {
            menuItems.unshift({
              icon: "fas fa-user-tie",
              text: "إدارة المحطة",
              href: UPDATED_SYSTEM_PATHS.STATION_MANAGER,
            });
          } else if (userRole === "مدير مركز") {
            menuItems.unshift({
              icon: "fas fa-user-cog",
              text: "إدارة المركز",
              href: UPDATED_SYSTEM_PATHS.CENTER_MANAGER,
            });
          } else if (userRole === "مدير النظام") {
            menuItems.unshift({
              icon: "fas fa-crown",
              text: "لوحة المدير",
              href: UPDATED_SYSTEM_PATHS.MANAGER_DASHBOARD,
            });
          }

          // إضافة زر تسجيل الخروج
          menuItems.push({
            icon: "fas fa-sign-out-alt",
            text: "تسجيل الخروج",
            action: "logout",
          });

          // بناء القائمة
          const menuHTML = menuItems
            .map((item) => {
              if (item.action === "logout") {
                return `
                            <li class="nav-item mt-3">
                                <a class="nav-link d-flex align-items-center logout-btn" href="#" onclick="event.preventDefault(); sidebarManager.logout();">
                                    <i class="${item.icon} me-2"></i> ${item.text}
                                </a>
                            </li>
                        `;
              }

              const specialClass = item.specialClass || "";
              return `
                        <li class="nav-item mb-2 ${specialClass}">
                            <a class="nav-link d-flex align-items-center" href="${item.href}" onclick="sidebarManager.handleNavigation(event, '${item.href}')">
                                <i class="${item.icon} me-2"></i> ${item.text}
                            </a>
                        </li>
                    `;
            })
            .join("");

          sidebarMenu.innerHTML = menuHTML;
        }

        getBaseMenuItems() {
          return [
            {
              icon: "fas fa-tachometer-alt",
              text: "لوحة التحكم",
              href: UPDATED_SYSTEM_PATHS.MAIN,
            },
            {
              icon: "fas fa-clock",
              text: "النشرات الساعية",
              href: UPDATED_SYSTEM_PATHS.HOURLY_REPORTS,
            },
            {
              icon: "fas fa-wind",
              text: "المناخ الساعي",
              href: UPDATED_SYSTEM_PATHS.CLIMATE_HOURLY,
            },
            {
              icon: "fas fa-calendar-day",
              text: "النشرات اليومية",
              href: UPDATED_SYSTEM_PATHS.DAILY_REPORTS,
            },
            {
              icon: "fas fa-cloud-rain",
              text: "النشرات المطرية",
              href: UPDATED_SYSTEM_PATHS.RAINFALL_REPORTS,
            },
            {
              icon: "fas fa-mountain",
              text: "حرارة التربة",
              href: UPDATED_SYSTEM_PATHS.SOIL_TEMPERATURE,
            },
            {
              icon: "fas fa-seedling",
              text: "النشرات الزراعية",
              href: UPDATED_SYSTEM_PATHS.AGRICULTURAL_REPORTS,
            },
            {
              icon: "fas fa-tools",
              text: "أعطال الرصد",
              href: UPDATED_SYSTEM_PATHS.FIX_EQUIPMENT,
            },
            {
              icon: "fas fa-phone-alt",
              text: "أعطال الاتصالات",
              href: UPDATED_SYSTEM_PATHS.FIX_TELECOMM,
            },
            {
              icon: "fas fa-laptop-code",
              text: "أعطال البرامج (IT)",
              href: UPDATED_SYSTEM_PATHS.FIX_SOFTWARE,
            },
          ];
        }

        handleNavigation(event, href) {
          event.preventDefault();

          // إذا كنا في iframe، نوجه الصفحة الأم
          if (window !== window.parent) {
            try {
              window.parent.location.href = href;
            } catch (e) {
              window.location.href = href;
            }
          } else {
            window.location.href = href;
          }
        }

        logout() {
          localStorage.removeItem("currentUser");

          if (window !== window.parent) {
            try {
              window.parent.location.href = "index.html";
            } catch (e) {
              window.location.href = "index.html";
            }
          } else {
            window.location.href = "index.html";
          }
        }
      }

      // إنشاء نسخة عامة من المدير
      const sidebarManager = new SidebarManager();
      window.sidebarManager = sidebarManager;
    </script>
  </body>
</html>
